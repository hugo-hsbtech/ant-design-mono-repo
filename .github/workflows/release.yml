name: Release

on:
  push:
    branches: [main]

# Serialize releases; never cancel a run mid-tag/mid-push.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  TURBO_TELEMETRY_DISABLED: 1
  NX_TELEMETRY_DISABLED: 1

jobs:
  release:
    name: nx release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags so nx can resolve each project's last
          # release tag and compute the conventional-commit bump.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: nx release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # On the very first run there are no `<project>@<version>` tags to diff
        # against, so nx needs --first-release to seed the baselines. After that,
        # tags exist and the standard command computes each bump from commits.
        # --skip-publish: all packages are private; we tag + release + changelog
        # but never publish to npm (the publish phase errors without a target).
        # --skip-publish implies non-interactive, so --yes is not used (they are
        # mutually exclusive); CI is non-TTY so no prompt is shown.
        run: |
          if [ -n "$(git tag --list)" ]; then
            pnpm nx release --skip-publish
          else
            pnpm nx release --first-release --skip-publish
          fi
